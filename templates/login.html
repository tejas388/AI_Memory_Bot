<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Memory Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                🧠
            </div>

            <h1>AI Memory Assistant</h1>

            <p class="subtitle">
                Your personal AI with long-term memory
            </p>


            <!-- ============================= -->
            <!-- Login -->
            <!-- ============================= -->

            <div id="login-section">

                <h2>Welcome Back</h2>

                <p class="section-text">
                    Login to access your memories and chat with your AI.
                </p>


                <form id="login-form">

                    <div class="input-group">

                        <label for="login-username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="login-username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="login-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Login
                    </button>

                </form>


                <p
                    id="login-message"
                    class="message"
                ></p>


                <p class="switch-text">

                    Don't have an account?

                    <button
                        type="button"
                        class="link-button"
                        onclick="showRegister()"
                    >
                        Create one
                    </button>

                </p>

            </div>


            <!-- ============================= -->
            <!-- Register -->
            <!-- ============================= -->

            <div
                id="register-section"
                class="hidden"
            >

                <h2>Create Account</h2>

                <p class="section-text">
                    Create your account to start building your AI memory.
                </p>


                <form id="register-form">

                    <div class="input-group">

                        <label for="register-username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="register-username"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="register-password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Minimum 6 characters"
                            required
                        >

                    </div>


                    <div class="input-group">

                        <label for="register-confirm-password">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="register-confirm-password"
                            placeholder="Repeat your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Create Account
                    </button>

                </form>


                <p
                    id="register-message"
                    class="message"
                ></p>


                <p class="switch-text">

                    Already have an account?

                    <button
                        type="button"
                        class="link-button"
                        onclick="showLogin()"
                    >
                        Login
                    </button>

                </p>

            </div>


        </div>

    </div>


    <script src="/static/script.js"></script>

</body>

</html>
